<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Astro-Vault</title>

        <link rel="stylesheet" href="links.css">
        <link rel="stylesheet" href="search.css">

    </head>

    <body>
        <div class="links">
        <a href="./index.html">Astro-Vault</a>
        <a href="./search.html">Search</a>
        <a href="./calculator.html">Calculator</a>
        </div>
        
        <!--Form below places user input into url, which is read in the JavaScript below-->
        <form action="./search.html" method="get"> 
            <input type="text" name="message" placeholder="Enter Star Name or ID">
            <button type="Submit">Submit</button>
        </form>

        <div id="output"></div>

        <div class="table-wrap">
            
            <button id="back-btn" class="btn">&#9664</button>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Constellation</th>
                        <th>ID</th>
                        <th>HIP</th>
                        <th>HD</th>
                        <th>HR</th>
                        <th>GL</th>
                    </tr>
                </thead>
                <tbody id="table-output"></tbody>
            </table>

            <button id="next-btn" class="btn">&#9654</button>
            
        </div>
    </body>

    <!--JavaScript-->
    <script src="search.js"></script>
</html>
